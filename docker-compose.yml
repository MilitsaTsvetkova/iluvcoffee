services:
  db-nestjs:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: nestjs_user
      POSTGRES_DB: nestjs_db
      POSTGRES_PASSWORD: Password123
    ports:
      - '5432:5432'
  test-db:
    image: postgres:16
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_PASSWORD: pass123
